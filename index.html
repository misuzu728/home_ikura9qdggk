<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>AR.js GPS + Proximity Check</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script>
      // Proximity Checker: Shows the model only when near target GPS
      AFRAME.registerComponent('proximity-checker', {
        schema: {
          targetLat: { type: 'number', default: 35.4464283 },
          targetLng: { type: 'number', default: 139.6325870 },
          radius: { type: 'number', default: 0.001 } // ~100m tolerance
        },
        init() {
          this.camera = document.querySelector('[gps-camera]');
          this.model = this.el;
          this.model.setAttribute('visible', 'false');
          console.log("Proximity checker initialized");
        },
        tick() {
          if (!this.camera) return;
          
          const camPos = this.camera.components['gps-camera'].currentCoords;
          if (!camPos) return;
          
          // Calculate distance (simplified for demo)
          const latDiff = this.data.targetLat - camPos.latitude;
          const lngDiff = this.data.targetLng - camPos.longitude;
          const distance = Math.sqrt(latDiff * latDiff + lngDiff * lngDiff);
          
          console.log(`Distance to target: ${distance} degrees`);
          
          if (distance < this.data.radius) {
            this.model.setAttribute('visible', 'true');
          } else {
            this.model.setAttribute('visible', 'false');
          }
        }
      });
    </script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; precision: medium;"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: true; detectionMode: mono;"
    >
      <a-assets>
        <!-- Replace with your model -->
        <a-asset-item id="model" src="https://cdn.glitch.com/0f3a1150-7682-4d46-8c93-3a716acae4e9%2Fscene.gltf?v=1597243900363"></a-asset-item>
      </a-assets>

      <!-- Model with GPS placement and proximity check -->
      <a-entity
        gltf-model="#model"
        scale="0.5 0.5 0.5"
        gps-entity-place="latitude: 35.4464283; longitude: 139.6325870;"
        proximity-checker
        look-at="[camera]"
        animation-mixer="loop: repeat"
      ></a-entity>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>
  </body>
</html>
